<ng-container *ngIf="items.length; else empty">
  <table mat-table [dataSource]="items" class="mat-elevation-z1">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Товар</th>
      <td mat-cell *matCellDef="let item">{{ item.product.name }}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Цена</th>
      <td mat-cell *matCellDef="let item">{{ item.product.price | currency:'RUB' }}</td>
    </ng-container>

    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef>Количество</th>
      <td mat-cell *matCellDef="let item">
        <mat-form-field appearance="outline" class="qty">
          <input matInput type="number" min="1" [value]="item.quantity" (input)="updateQuantity(item.product.id, $any($event.target).value)">
        </mat-form-field>
      </td>
    </ng-container>

    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef>Итого</th>
      <td mat-cell *matCellDef="let item">{{ item.product.price * item.quantity | currency:'RUB' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let item">
        <button mat-icon-button color="warn" (click)="remove(item.product.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <div class="cart-summary">
    <div>
      <p class="label">Сумма корзины</p>
      <p class="total">{{ total | currency:'RUB' }}</p>
    </div>
    <a mat-flat-button color="primary" routerLink="/checkout">Оформить заказ</a>
  </div>
</ng-container>

<ng-template #empty>
  <p class="empty">Корзина пуста. Добавьте товары из каталога.</p>
  <a mat-button color="primary" routerLink="/catalog">Перейти в каталог</a>
</ng-template>
