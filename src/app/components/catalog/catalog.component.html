<section class="filters">
  <mat-form-field appearance="outline">
    <mat-label>Поиск товара</mat-label>
    <input matInput placeholder="ноутбук, видеокарта…" [formControl]="filters.controls.term">
    <button mat-icon-button matSuffix *ngIf="filters.controls.term.value" (click)="filters.controls.term.setValue('')">
      <mat-icon>close</mat-icon>
    </button>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Категория</mat-label>
    <mat-select [formControl]="filters.controls.category">
      <mat-option value="">Все категории</mat-option>
      <mat-option *ngFor="let category of categories" [value]="category">{{ category }}</mat-option>
    </mat-select>
  </mat-form-field>
</section>

<section class="grid">
  <mat-card *ngFor="let product of products" class="product-card">
    <img mat-card-image [src]="product.image" [alt]="product.name">
    <mat-card-header>
      <mat-card-title>{{ product.name }}</mat-card-title>
      <mat-card-subtitle>{{ product.category }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p class="price">{{ product.price | currency:'RUB' }}</p>
      <p class="description">{{ product.description }}</p>
      <p class="meta"><mat-icon>inventory_2</mat-icon> {{ product.stock }} на складе</p>
    </mat-card-content>
    <mat-card-actions>
      <a mat-stroked-button color="primary" [routerLink]="['/product', product.id]">Подробнее</a>
      <span class="rating"><mat-icon>star</mat-icon>{{ product.rating }}</span>
    </mat-card-actions>
  </mat-card>
</section>
