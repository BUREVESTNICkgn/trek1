<section class="auth">
  <mat-card class="panel">
    <mat-card-title>Добро пожаловать в «Компьютер»</mat-card-title>
    <p class="hint">Стиль Авито, но на Angular Material: подайте объявление или войдите, чтобы покупать технику.</p>

    <mat-tab-group>
      <mat-tab label="Вход">
        <form class="form" [formGroup]="loginForm" (ngSubmit)="login()">
          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Пароль</mat-label>
            <input matInput type="password" formControlName="password" />
          </mat-form-field>
          <button mat-flat-button color="primary" type="submit">Войти</button>
        </form>
      </mat-tab>
      <mat-tab label="Регистрация">
        <form class="form" [formGroup]="registerForm" (ngSubmit)="register()">
          <mat-form-field appearance="outline"><mat-label>Имя</mat-label><input matInput formControlName="name" /></mat-form-field>
          <mat-form-field appearance="outline"><mat-label>Email</mat-label><input matInput formControlName="email" /></mat-form-field>
          <mat-form-field appearance="outline"><mat-label>Пароль</mat-label><input matInput type="password" formControlName="password" /></mat-form-field>
          <mat-form-field appearance="outline"><mat-label>Адрес для доставки</mat-label><textarea matInput rows="2" formControlName="address"></textarea></mat-form-field>
          <button mat-flat-button color="primary" type="submit">Создать аккаунт</button>
        </form>
      </mat-tab>
    </mat-tab-group>

    <p class="error" *ngIf="error()">{{ error() }}</p>
  </mat-card>
</section>
